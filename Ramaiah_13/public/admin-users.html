<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - User Management</title>
    <link rel="stylesheet" href="/styles/styles.css"> <!-- Reuse your existing styles -->
    <style>
        /* Specific styles for user management page */
        .user-management-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .user-form {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            width: 80%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .user-form label {
            margin-bottom: 10px;
            font-weight: bold;
            width: 100%;
        }
        .user-form input, .user-form select {
            margin-bottom: 15px;
            padding: 10px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .user-form button {
            padding: 10px 20px;
            background-color: #28a745; /* Green for create */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .user-form button:hover {
            background-color: #218838;
        }
        .user-list-container {
            width: 80%;
            max-width: 800px;
            text-align: center;
        }
        /* Reuse table styles from admin.html */
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; font-weight: bold; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <a href="/logout" class="logout-link">Logout</a>
    <!-- Add links to navigate between admin sections -->
    <div style="text-align: center; margin-bottom: 20px;">
        <a href="/admin.html" style="margin-right: 15px;">View All Submissions</a>
        <a href="/admin-users.html">User Management</a>
    </div>

    <div class="user-management-container">
        <h1>User Management</h1>

        <div class="user-form">
            <h2>Create New User</h2>
            <form id="createUserForm">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <label for="role">Role:</label>
                <select id="role" name="role" required>
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>

                <button type="submit">Add User</button>
            </form>
            <div id="userMessage" class="message"></div>
        </div>

        <div class="user-list-container">
            <h2>Existing Users</h2>
            <table id="user-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                    <!-- User rows will be populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const createUserForm = document.getElementById('createUserForm');
        const userMessage = document.getElementById('userMessage');
        const userTableBody = document.getElementById('user-table-body');

        // Fetch and display existing users on page load
        async function fetchUsers() {
            try {
                const response = await fetch('/admin/users'); // New endpoint
                if (response.status === 401 || response.status === 403) {
                    window.location.href = '/login.html';
                    return;
                }
                const users = await response.json();
                userTableBody.innerHTML = ''; // Clear existing rows

                if (users.length === 0) {
                    userTableBody.innerHTML = '<tr><td colspan="4">No users found.</td></tr>';
                    return;
                }

                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.username}</td>
                        <td>${user.role}</td>
                        <td>
                            <button class="delete-user-btn" data-user-id="${user.id}">Delete</button>
                        </td>
                    `;
                    userTableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching users:', error);
                userMessage.textContent = 'Error loading users.';
                userMessage.style.color = 'red';
            }
        }

        // Handle user creation form submission
        createUserForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(createUserForm);
            const userData = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/admin/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                const result = await response.json();

                if (response.ok) {
                    userMessage.textContent = result.message;
                    userMessage.style.color = 'green';
                    createUserForm.reset();
                    fetchUsers(); // Refresh the user list
                } else {
                    userMessage.textContent = result.message || 'Failed to create user.';
                    userMessage.style.color = 'red';
                }
            } catch (error) {
                console.error('Error creating user:', error);
                userMessage.textContent = 'Error creating user.';
                userMessage.style.color = 'red';
            }
        });

        // Handle user deletion (event delegation)
        userTableBody.addEventListener('click', async (e) => {
            if (e.target.classList.contains('delete-user-btn')) {
                const userId = e.target.dataset.userId;
                if (confirm('Are you sure you want to delete this user?')) {
                    try {
                        const response = await fetch(`/admin/users/${userId}`, {
                            method: 'DELETE'
                        });
                        const result = await response.json();

                        if (response.ok) {
                            userMessage.textContent = result.message;
                            userMessage.style.color = 'green';
                            fetchUsers(); // Refresh the user list
                        } else {
                            userMessage.textContent = result.message || 'Failed to delete user.';
                            userMessage.style.color = 'red';
                        }
                    } catch (error) {
                        console.error('Error deleting user:', error);
                        userMessage.textContent = 'Error deleting user.';
                        userMessage.style.color = 'red';
                    }
                }
            }
        });

        // Initial fetch of users
        fetchUsers();
    </script>
</body>
</html>
